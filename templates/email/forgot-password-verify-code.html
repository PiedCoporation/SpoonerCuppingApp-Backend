<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify reset code • CoffeeCupping</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f6f7f9">
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      width="100%"
      style="background-color: #f6f7f9"
    >
      <tr>
        <td align="center" style="padding: 24px">
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="
              max-width: 600px;
              background-color: #ffffff;
              border-radius: 12px;
              overflow: hidden;
              border: 1px solid #e9ebf0;
            "
          >
            <tr>
              <td
                style="
                  padding: 28px 28px 8px 28px;
                  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                    Roboto, Helvetica, Arial, sans-serif;
                  color: #111827;
                "
              >
                <div style="font-size: 14px; color: #6b7280">CoffeeCupping</div>
                <h1
                  style="
                    margin: 8px 0 0 0;
                    font-size: 22px;
                    line-height: 28px;
                    font-weight: 700;
                    color: #111827;
                  "
                >
                  Enter your verification code
                </h1>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 0 28px 16px 28px;
                  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                    Roboto, Helvetica, Arial, sans-serif;
                  color: #374151;
                  font-size: 14px;
                  line-height: 20px;
                "
              >
                Use this code to verify your password reset for CoffeeCupping.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 8px 28px 8px 28px">
                <div
                  style="
                    display: inline-block;
                    letter-spacing: 8px;
                    background: #f9fafb;
                    border: 1px solid #e5e7eb;
                    border-radius: 8px;
                    padding: 14px 18px;
                    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                      Consolas, 'Liberation Mono', 'Courier New', monospace;
                    font-size: 22px;
                    font-weight: 700;
                    color: #111827;
                  "
                >
                  {{.code}}
                </div>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 0 28px 24px 28px;
                  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                    Roboto, Helvetica, Arial, sans-serif;
                  color: #6b7280;
                  font-size: 12px;
                  line-height: 18px;
                "
              >
                This code will expire {{.minutes}} minutes after this email was
                sent.
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 0 28px 28px 28px;
                  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                    Roboto, Helvetica, Arial, sans-serif;
                  color: #6b7280;
                  font-size: 12px;
                  line-height: 18px;
                "
              >
                If you didn’t request a password reset, you can safely ignore
                this email.
              </td>
            </tr>
          </table>
          <div
            style="
              max-width: 600px;
              margin: 12px auto 0 auto;
              color: #9ca3af;
              font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                Helvetica, Arial, sans-serif;
              font-size: 12px;
              line-height: 18px;
            "
          >
            Need help? Reply to this email.
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
